<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>システムメンテナンス中</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        custom: {
                            bgLight: '#f8f9fa',
                            bgDark: '#121212',
                            textMainLight: '#333333',
                            textMainDark: '#e0e0e0',
                            textSubLight: '#666666',
                            textSubDark: '#aaaaaa',
                            btnBgLight: '#f1f3f5',
                            btnBgDark: '#3c3c3c',
                            btnBorderLight: '#ced4da',
                            btnBorderDark: '#555555'
                        }
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-custom-bgLight dark:bg-custom-bgDark text-custom-textMainLight dark:text-custom-textMainDark flex flex-col items-center justify-center min-h-screen m-0 p-5 box-border text-center transition-colors duration-300">

    <img src="/logo.webp" alt="システムメンテナンス中" class="w-24 md:w-32 mb-6 object-contain" onerror="this.src='https://placehold.co/128x128/transparent/666666?text=Logo'; this.onerror=null;">
    
    <h1 id="maintenance-title" class="text-4xl md:text-6xl font-bold m-0 leading-tight">システムメンテナンス中/h1>
    <h2 id="maintenance-subtitle" class="text-lg md:text-3xl font-medium mt-4 mb-6">ご迷惑をおかけし、申し訳ございません。</h2>
    
    <p id="maintenance-message" class="text-custom-textSubLight dark:text-custom-textSubDark mb-8 leading-relaxed max-w-lg">
        サービス向上およびシステム保守のため、一時的に<strong>ログイン後の全機能</strong>を停止しております。<br>
        ご不便をおかけいたしますが、復旧までしばらくお待ちください。
    </p>

    <div id="maintenance-recovery-container" class="hidden mb-8 p-4 bg-red-100 dark:bg-red-900/30 border border-red-300 dark:border-red-800/50 rounded-lg text-red-600 dark:text-red-400 font-bold text-base md:text-lg">
        復旧予定: <span id="maintenance-recovery">--</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const recoveryContainer = document.getElementById('maintenance-recovery-container');
            const recoveryText = document.getElementById('maintenance-recovery');
            
            const expectedRecoveryTime = "未定 (現在確認中)"; 
            
            if (expectedRecoveryTime) {
                recoveryText.textContent = expectedRecoveryTime;
                
                recoveryContainer.classList.remove('hidden');
                recoveryContainer.classList.add('inline-block');
            }
        });
    </script>
</body>
</html>
